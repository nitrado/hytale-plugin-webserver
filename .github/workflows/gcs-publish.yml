name: GCS Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The semver version string, e.g. 1.1.1-rc1+2026.02.19-1a311a592"
        type: string
        required: true
      tag-name:
        description: "The GitHub release tag name"
        type: string
        required: true

permissions:
  contents: read

jobs:
  gcs-publish:
    uses: nitrado/hytale-plugin-workflows/.github/workflows/gcs-publish.yml@v2
    secrets: inherit
    with:
      artifact-id: "nitrado-webserver"
      version: ${{ inputs.version }}
      tag-name: ${{ inputs.tag-name }}


